name: Finalize Beta.3 Hotfix Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta3-hotfix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Correct hotfix release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Beta.3 hotfix for Android physical-smoke regressions.

          Fixes:
          - restores the live-game More menu on Android
          - fixes the narrow-screen Lobby header layout
          - restores direct 2-6 Max players buttons in Pregame

          App version remains `1.0.0-beta.3`.
          Android versionCode: `4`.

          Runtime candidate: `36717a2284490c8179e35b882dca0bde15a14a75`
          Exact-candidate CI: run #724 / `36366120596` — success
          Publisher run: `36366347391` — success
          APK: `Hanab-Mobile-1.0.0-beta.3.apk`
          APK bytes: `135756615`
          APK SHA-256: `80543d8c8fc2573e0bca3dfc972d00af771bcdd71ca2d5bdfe507e549884a9f9`
          EOF

          gh release edit v1.0.0-beta.3-hotfix.1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hanab Mobile 1.0.0-beta.3 hotfix 1" \
            --notes-file release-notes.md

          gh release edit v1.0.0-beta.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hanab Mobile 1.0.0-beta.3 (superseded by hotfix 1)"
