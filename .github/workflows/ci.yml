name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependency graph
        run: npm audit --omit=dev --json || true
      - name: Audit full dependency graph
        run: npm audit --json || true
      - run: npm run typecheck
      - run: npm test
      - run: git diff --check HEAD^..HEAD
