name: Android Beta APK

on:
  push:
    branches:
      - release/android-beta-packaging
    paths:
      - app.json
      - package.json
      - package-lock.json
      - tools/build-android-beta.mjs
      - .github/workflows/android-beta.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - run: npm run android:beta-apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hanab-Mobile-1.0.0-beta.1
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
