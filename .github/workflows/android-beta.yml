name: Android Release Candidate APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'release-candidate/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - run: npm run android:beta-apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hanab-Mobile-1.0.0-rc.3
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
