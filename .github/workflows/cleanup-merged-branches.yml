name: Cleanup merged branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete merged PR head branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hanab-mobile-merged-branch-cleanup",
          }

          def get(path):
              request = urllib.request.Request(f"{api}{path}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def paged(path):
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = get(f"{path}{separator}per_page=100&page={page}")
                  if not batch:
                      return
                  yield from batch
                  if len(batch) < 100:
                      return
                  page += 1

          repository = get(f"/repos/{repo}")
          default_branch = repository["default_branch"]

          merged_heads = set()
          for pr in paged(f"/repos/{repo}/pulls?state=closed"):
              head_repo = (pr.get("head") or {}).get("repo") or {}
              if pr.get("merged_at") and head_repo.get("full_name") == repo:
                  merged_heads.add(pr["head"]["ref"])

          open_heads = set()
          for pr in paged(f"/repos/{repo}/pulls?state=open"):
              head_repo = (pr.get("head") or {}).get("repo") or {}
              if head_repo.get("full_name") == repo:
                  open_heads.add(pr["head"]["ref"])

          branches = list(paged(f"/repos/{repo}/branches"))
          existing = {branch["name"] for branch in branches}
          protected = {branch["name"] for branch in branches if branch.get("protected")}

          candidates = sorted(
              (merged_heads & existing)
              - open_heads
              - protected
              - {default_branch}
          )

          print(f"Existing branches: {len(existing)}")
          print(f"Merged PR heads still present: {len(candidates)}")
          if candidates:
              print("Deleting:")
              for branch in candidates:
                  print(f"  {branch}")

          deleted = []
          for branch in candidates:
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              request = urllib.request.Request(
                  f"{api}/repos/{repo}/git/refs/{ref}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code in (404, 422):
                      print(f"Skipped already absent/non-deletable branch: {branch}")
                      continue
                  raise
              deleted.append(branch)

          print(f"Deleted branches: {len(deleted)}")
          PY
