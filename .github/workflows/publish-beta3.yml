name: Publish Beta.3 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beta3.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download frozen Beta.3 artifact
        uses: actions/download-artifact@v4
        with:
          name: Hanab-Mobile-1.0.0-beta.3
          path: release-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36361833453

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          test -f release-artifact/Hanab-Mobile-1.0.0-beta.3.apk
          echo "37daceaaac21c4867825876ff19e549654e5ae56f17c75482d08d1fcec92abcf  release-artifact/Hanab-Mobile-1.0.0-beta.3.apk" | sha256sum -c -
          test "$(stat -c %s release-artifact/Hanab-Mobile-1.0.0-beta.3.apk)" = "135761383"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Beta.3 is the pre-redesign Android tester baseline.

          ## Highlights

          - read-only Tagged games and exact tag search in History
          - arbitrary JSON replay import and finished-review export/share
          - canonical replay, game, and pregame link opening
          - specific-seed Create and History prefill
          - server-backed Reverse hands
          - supported Create-table preference persistence
          - Show turn timers in untimed games
          - Hypothetical morph/unmorph controls
          - stronger account, lobby-status, friend, Pregame, and chat handling

          ## Known limitations

          - rapid replay scrubber movement may still visibly jank (issue #4)
          - compact shell/Pregame redesign remains deferred to the Mobile App Design pass (issue #58)
          - private Dialog history is session-local; durable Chats/Messages is post-beta.3 design work
          - this is a standalone tester APK, not the Play Store/AAB pipeline

          ## Build identity

          - version: `1.0.0-beta.3`
          - Android `versionCode`: `3`
          - frozen runtime candidate: `fd9919bf7b764354c4f4cce75a96a90c1f2e5506`
          - ordinary CI: run #719 / `36361502403` — success
          - Android build: run #3 / `36361833453` — success
          - workflow head: `3d75474b92b7626086b1d55905f91dbbf5922f58` (docs-only descendant of the runtime candidate)
          - APK: `Hanab-Mobile-1.0.0-beta.3.apk`
          - size: `135761383` bytes
          - SHA-256: `37daceaaac21c4867825876ff19e549654e5ae56f17c75482d08d1fcec92abcf`

          ## Validation status

          CI and the standalone Android build are green. Physical upgrade-over-beta.2 and clean-install
          smoke are still pending, so this remains a prerelease/tester candidate rather than a broadly
          validated release.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0-beta.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v1.0.0-beta.3 already exists" >&2
            exit 1
          fi
          gh release create v1.0.0-beta.3             release-artifact/Hanab-Mobile-1.0.0-beta.3.apk             --repo "${GITHUB_REPOSITORY}"             --target fd9919bf7b764354c4f4cce75a96a90c1f2e5506             --title "Hanab Mobile 1.0.0-beta.3"             --notes-file release-notes.md             --prerelease
