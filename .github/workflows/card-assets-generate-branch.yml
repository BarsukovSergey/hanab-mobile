name: Generate card presentation assets

on:
  push:
    branches:
      - feat/card-presentation-asset-modes

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate card assets
        run: npm run cards:generate

      - name: Check generated card assets
        run: npm run cards:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused tests
        run: npm test -- --runInBand src/game/selectors/upstreamCardAssets.test.ts

      - name: Check diff formatting
        run: git diff --check

      - name: Upload generated card assets
        uses: actions/upload-artifact@v4
        with:
          name: card-presentation-assets
          path: assets/cards/upstream/

      - name: Commit generated card assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/upstream
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "build: bundle card presentation assets"
          git push origin HEAD:feat/card-presentation-asset-modes
